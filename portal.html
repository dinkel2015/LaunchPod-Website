// ---------------------------------------------------------------------
// SCREEN ROUTER
// ---------------------------------------------------------------------
function renderScreen() {
  if (state.screen === "login" || state.screen === "signup") return renderAuth();
  if (state.screen === "wizard") return renderWizard();
  if (state.screen === "dashboard") return renderDashboard();
  return "";
}

// ---------------------------------------------------------------------
// EVENTS
// ---------------------------------------------------------------------
function bindEvents() {
  root.querySelectorAll("[data-action]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      const action = el.getAttribute("data-action");
      const value = el.getAttribute("data-value");
      handleAction(action, value);
    });
  });
  // Keep text inputs in sync without losing focus on every keystroke —
  // read values back into state on blur/change rather than full re-render per keystroke.
  const bindInput = (id, path) => {
    const el = root.querySelector("#" + id);
    if (!el) return;
    el.addEventListener("change", () => setPath(path, el.value));
  };
  bindInput("loginEmail", "loginEmail");
  bindInput("loginPassword", "loginPassword");
  bindInput("authName", "auth.name");
  bindInput("authCompany", "auth.company");
  bindInput("authEmail", "auth.email");
  bindInput("authPassword", "auth.password");
  bindInput("authConfirm", "auth.confirm");
  bindInput("boostAdSpend", "pkg.pods.boost.adSpend");
  bindInput("promoCodeInput", "pkg.promoCodeInput");
  bindInput("payName", "pay.name");
  bindInput("payZip", "pay.zip");
}

function setPath(path, value) {
  const parts = path.split(".");
  let obj = state;
  for (let i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
  obj[parts[parts.length - 1]] = value;
}

/* Runs an async action with a busy flag so a double-click cannot fire two
   checkouts, and funnels failures into a caller-supplied error setter
   rather than an unhandled rejection. */
async function withBusy(fn, onError) {
  if (backend.busy) return;
  backend.busy = true;
  render();
  try {
    await fn();
  } catch (e) {
    onError(e.message || "Something went wrong.");
  } finally {
    backend.busy = false;
  }
}

async function handleAction(action, value) {
  const pkg = state.pkg;
  if (backend.busy) return;
  switch (action) {
    case "goLogin": state.screen = "login"; state.loginError = ""; break;
    case "goSignup": state.screen = "signup"; break;
    case "doLogin": {
      if (!state.loginEmail || !state.loginPassword) { state.loginError = "Enter your email and password."; break; }
      state.loginError = "";
      await withBusy(async () => {
        const session = await authFetch("token?grant_type=password", {
          email: state.loginEmail, password: state.loginPassword,
        });
        saveSession(session);
        state.loginPassword = "";
        applySubscription(await fetchSubscription());
        state.screen = state.hasPackage ? "dashboard" : "wizard";
      }, (msg) => { state.loginError = msg; });
      break;
    }
    case "doSignup": {
      const a = state.auth;
      if (!a.name || !a.company || !a.email || !a.password) { a.error = "Please fill in all fields."; break; }
      if (a.password.length < 8) { a.error = "Password must be at least 8 characters."; break; }
      if (a.password !== a.confirm) { a.error = "Passwords do not match."; break; }
      a.error = "";
      await withBusy(async () => {
        const session = await authFetch("signup", {
          email: a.email,
          password: a.password,
          data: { name: a.name, company: a.company },
        });
        state.loginEmail = a.email;
        a.password = ""; a.confirm = "";

        /* With email confirmation switched on, signup returns a user but
           no session. Say so rather than dropping them into a wizard
           they cannot check out from. */
        if (!session.access_token) {
          a.error = "Check your email to confirm your account, then sign in.";
          state.screen = "login";
          return;
        }
        saveSession(session);
        state.screen = "wizard";
        applyPathFromQuery();   // keep any ?path= they arrived with
      }, (msg) => { a.error = msg; });
      break;
    }
    case "doLogout":
      saveSession(null);
      state.hasPackage = false;
      state.clickupDashboardUrl = null;
      state.subscriptionId = null;
      state.billing = { brand: null, last4: null, nextChargeOn: null };
      backend.card = null;
      state.screen = "login";
      break;
    case "setPath": pkg.path = value; break;
    case "setLaunchEpisodes": pkg.launch.episodes = Number(value); break;
    case "setLaunchLength": pkg.launch.lengthMin = Number(value); break;
    case "setLaunchLocation": pkg.launch.location = value; break;
    case "toggleScripting": pkg.launch.scripting = !pkg.launch.scripting; break;
    case "setOrbitTier": pkg.orbit.tier = value; break;
    case "setOrbitVoice": pkg.orbit.voice = value; break;
    case "toggleWeb": pkg.pods.web.enabled = !pkg.pods.web.enabled; break;
    case "setWebFreq": pkg.pods.web.freq = value; break;
    case "toggleTranscripts": pkg.pods.web.transcripts = !pkg.pods.web.transcripts; break;
    case "toggleEmbeddedPlayers": pkg.pods.web.embeddedPlayers = !pkg.pods.web.embeddedPlayers; break;
    case "toggleEmbeddedVideo": pkg.pods.web.embeddedVideo = !pkg.pods.web.embeddedVideo; break;
    case "setBlogLength": pkg.pods.web.blogLength = value; break;
    case "toggleSocial": pkg.pods.social.enabled = !pkg.pods.social.enabled; break;
    case "setSocialClips": pkg.pods.social.clips = Number(value); break;
    case "toggleProduction": pkg.pods.production.enabled = !pkg.pods.production.enabled; break;
    case "setProductionFreq": pkg.pods.production.freq = Number(value); break;
    case "toggleBoost": pkg.pods.boost.enabled = !pkg.pods.boost.enabled; break;
    case "setBoostAds": pkg.pods.boost.adsPerMo = Number(value); break;
    case "setPaymentPlan": pkg.paymentPlan = value; break;
    case "applyPromoCode": {
      const code = (pkg.promoCodeInput || "").trim();
      if (!code) { pkg.promoApplied = null; pkg.promoError = true; break; }
      await withBusy(async () => {
        const result = await api("/api/promo/validate", { code });
        if (result.valid) { pkg.promoApplied = result.promo; pkg.promoError = false; }
        else { pkg.promoApplied = null; pkg.promoError = true; }
      }, () => { pkg.promoApplied = null; pkg.promoError = true; });
      break;
    }
    case "toggleTosAccept": state.tosAccepted = !state.tosAccepted; break;
    case "goBack": state.wizardStep = Math.max(0, state.wizardStep - 1); break;
    case "goNext": {
      const steps = stepsFor(pkg.path);
      const stepId = steps[Math.min(state.wizardStep, steps.length - 1)];

      if (stepId === "payment") {
        /* The charge must succeed before the wizard advances — an
           unconditional advance here would show a client a success
           screen for a card that was declined. */
        const price = computePricing();
        let ok = false;
        await withBusy(async () => {
          const { sourceId, verificationToken } = await tokenizeCard(Math.round(price.chargedToday * 100));
          const result = await api("/api/checkout", {
            selection: {
              path: pkg.path, launch: pkg.launch, orbit: pkg.orbit,
              pods: pkg.pods, paymentPlan: pkg.paymentPlan,
            },
            promoCode: pkg.promoApplied ? pkg.promoApplied.code : null,
            sourceId, verificationToken,
            payment: { name: state.pay.name, zip: state.pay.zip },
            tos: { text: renderedTosText(pkg.path), rev: TOS_REV },
          });
          state.hasPackage = true;
          state.subscriptionId = result.subscriptionId;
          state.clickupDashboardUrl = result.dashboardUrl || null;
          /* The server is authoritative on price; show what was actually
             charged rather than the local preview. */
          state.chargedTodayCents = result.chargedTodayCents;
          state.billing = {
            brand: result.cardBrand || null,
            last4: result.cardLast4 || null,
            nextChargeOn: result.nextChargeOn || null,
          };
          backend.card = null;
          ok = true;
        }, (msg) => { state.payError = msg; });

        if (!ok) break;
        state.payError = "";
      }

      state.wizardStep += 1;
      break;
    }
    case "goToDashboard": state.screen = "dashboard"; state.editMode = false; state.wizardStep = 0; break;
    case "startEdit": state.screen = "wizard"; state.editMode = true; state.wizardStep = 0; break;
  }
  render();
}

// ---------------------------------------------------------------------
// BOOT
// ---------------------------------------------------------------------
/* Restore a stored session before the first paint so a reload lands the
   client back on their dashboard rather than the sign-in screen. Render
   immediately either way — waiting on the network to draw anything would
   leave the page blank if Supabase is slow. */
/* The marketing site links in as /portal?path=postcast etc, so a visitor
   who clicked "Get started" from a product page lands on that package
   already chosen rather than back at "Choose how you start". Anything
   unrecognised is ignored — this is a URL a stranger can edit. */
function applyPathFromQuery() {
  const wanted = new URLSearchParams(location.search).get("path");
  const allowed = ["launch", "postcast", "webicast", "audit"];
  if (!wanted || !allowed.includes(wanted)) return;
  state.pkg.path = wanted;
  // Skip "Choose path" only because the choice was already made for them.
  state.wizardStep = 1;
}

async function boot() {
  loadStoredSession();
  applyPathFromQuery();
  render();

  if (!backend.session) return;
  try {
    const token = await accessToken();
    if (!token) { render(); return; }
    applySubscription(await fetchSubscription());
    state.screen = state.hasPackage ? "dashboard" : "wizard";
  } catch {
    // A dead session just means they sign in again.
    saveSession(null);
    state.screen = "login";
  }
  render();
}

boot();
</script>
