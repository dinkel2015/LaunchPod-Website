/* =====================================================================
   LAUNCHPOD MEDIA — CLIENT PORTAL
   Vanilla HTML/CSS/JS rebuild of the prototype (no external runtime).
   Pricing constants ported verbatim from propdoc/config/pricing.ts —
   the same numbers PropDoc uses to generate sales proposals — so the
   portal and the sales tool never drift apart. If pricing changes,
   change it in BOTH places (or better: factor this block out into a
   shared package both apps import).

   INTEGRATION TODOs are marked explicitly throughout. Nothing in this
   file talks to a real backend yet — see the TODO blocks for:
     - Auth            (Supabase Auth — propdoc already has a Supabase project)
     - Payment          (Square Web Payments SDK — needs Application ID + Location ID,
                          which are public/non-secret and safe to hardcode here;
                          actual charges must go through a server-side /api route
                          using the SECRET key, never in this file)
     - ClickUp handoff  (serverless function that duplicates the client template
                          folder and returns a Dashboard URL to show here)
   ===================================================================== */

function fmt(n) {
  n = Math.round(n || 0);
  return "$" + n.toLocaleString("en-US");
}
function lengthBucket(len) { return len >= 90 ? "90plus" : String(len); }
/* Billing dates are plain 'YYYY-MM-DD'. Split them rather than passing to
   the Date constructor, which reads a bare date as UTC and can render the
   previous day for anyone west of Greenwich. */
function fmtDate(ymd) {
  const [y, m, d] = String(ymd).split("-").map(Number);
  if (!y || !m || !d) return ymd;
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
}

// ---------------------------------------------------------------------
// STATE
// ---------------------------------------------------------------------
const state = {
  screen: "login", // login | signup | wizard | dashboard
  loginEmail: "", loginPassword: "", loginError: "",
  auth: { name: "", company: "", email: "", password: "", confirm: "", error: "" },
  hasPackage: false, editMode: false,
  wizardStep: 0,
  pkg: {
    path: "launch",
    launch: { episodes: 10, lengthMin: 45, scripting: false, location: "lpm" },
    orbit: { tier: "standard", voice: "1" },
    pods: {
      web: { enabled: false, freq: "4", transcripts: false, embeddedPlayers: false, embeddedVideo: false, blogLength: "none" },
      social: { enabled: false, clips: 4 },
      production: { enabled: false, freq: 4 },
      boost: { enabled: false, adsPerMo: 1, adSpend: 500 },
    },
    paymentPlan: "monthly", promoCodeInput: "", promoApplied: null, promoError: false,
  },
  tosAccepted: false,
  pay: { name: "", zip: "" }, // card fields intentionally NOT modeled here — see Payment step TODO
  onboarding: { date: null, time: null, booked: false },
  payError: "",

  // Populated from the subscription row after checkout / on reload.
  billing: { brand: null, last4: null, nextChargeOn: null },
  // What the server actually charged, in cents. Set from /api/checkout's
  // response; the server is authoritative, the local preview is not.
  chargedTodayCents: null,
  // Set from the subscription row after checkout — /api/clickup/provision
  // writes it there. Null until provisioning has run.
  clickupDashboardUrl: null,
};

const auditPrice = PRICING.AUDIT_PRICE_DEFAULT;

// ---------------------------------------------------------------------
// BACKEND — Supabase Auth + /api integration
//
// Deliberately no Supabase JS bundle: its auth surface is a handful of
// REST calls, and plain fetch keeps this file's "no external runtime"
// property intact. The Square Web Payments SDK is the one unavoidable
// dependency — card fields must live inside Square's iframe so raw card
// data never touches this origin.
//
// Public ids come from /api/config rather than being hardcoded, so
// sandbox and production differ only by Vercel env vars.
// ---------------------------------------------------------------------
const SESSION_KEY = "lpm.session";

const backend = {
  config: null,
  session: null,   // { access_token, refresh_token, expires_at, user }
  card: null,      // Square card instance
  busy: false,
};

async function loadConfig() {
  if (backend.config) return backend.config;
  const res = await fetch("/api/config");
  if (!res.ok) throw new Error("Portal configuration is unavailable. Please try again shortly.");
  backend.config = await res.json();
  return backend.config;
}

function saveSession(session) {
  backend.session = session;
  try {
    if (session) localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    else localStorage.removeItem(SESSION_KEY);
  } catch { /* private browsing — session stays in memory only */ }
}

function loadStoredSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (raw) backend.session = JSON.parse(raw);
  } catch { backend.session = null; }
}

/* Supabase Auth REST. Errors come back as {error_description|msg|error}. */
async function authFetch(path, body) {
  const cfg = await loadConfig();
  const res = await fetch(`${cfg.supabaseUrl}/auth/v1/${path}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: cfg.supabaseAnonKey },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data.error_description || data.msg || data.error || "Authentication failed.");
  }
  return data;
}

/* Refreshes an expired access token before it is used. Supabase access
   tokens are short-lived; without this a client who leaves the tab open
   gets a spurious "session expired" at the payment step. */
async function accessToken() {
  const s = backend.session;
  if (!s) return null;
  const expiresAt = (s.expires_at || 0) * 1000;
  if (expiresAt && Date.now() > expiresAt - 60_000 && s.refresh_token) {
    try {
      const refreshed = await authFetch("token?grant_type=refresh_token", { refresh_token: s.refresh_token });
      saveSession(refreshed);
      return refreshed.access_token;
    } catch {
      saveSession(null);
      return null;
    }
  }
  return s.access_token;
}

async function api(path, body) {
  const token = await accessToken();
  if (!token) throw new Error("Your session has expired. Please sign in again.");
  const res = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Something went wrong. Please try again.");
  return data;
}

/* Reads the client's existing subscription straight from PostgREST under
   their own JWT — RLS restricts this to their own rows. */
async function fetchSubscription() {
  const cfg = await loadConfig();
  const token = await accessToken();
  if (!token) return null;
  const res = await fetch(
    `${cfg.supabaseUrl}/rest/v1/subscriptions?select=*&order=created_at.desc&limit=1`,
    { headers: { apikey: cfg.supabaseAnonKey, Authorization: `Bearer ${token}` } },
  );
  if (!res.ok) return null;
  const rows = await res.json();
  return rows[0] || null;
}

/* Rehydrates the wizard/dashboard from a stored subscription. `selection`
   is persisted in exactly the shape of state.pkg, so it slots straight
   back in without a translation layer. */
function applySubscription(sub) {
  if (!sub) { state.hasPackage = false; return; }
  state.hasPackage = true;
  state.pkg = { ...state.pkg, ...sub.selection, promoCodeInput: "", promoApplied: null, promoError: false };
  state.clickupDashboardUrl = sub.clickup_dashboard_url || null;
  state.subscriptionId = sub.id;
  state.billing = {
    brand: sub.square_card_brand || null,
    last4: sub.square_card_last4 || null,
    nextChargeOn: sub.next_charge_on || null,
  };
}

// ---------------------------------------------------------------------
// SQUARE WEB PAYMENTS
// ---------------------------------------------------------------------
/* Sandbox and production serve the SDK from different hosts, so the tag
   is injected once /api/config says which environment this is. */
function loadSquareSdk(env) {
  if (window.Square) return Promise.resolve();
  const src = env === "production"
    ? "https://web.squarecdn.com/v1/square.js"
    : "https://sandbox.web.squarecdn.com/v1/square.js";
  return new Promise((resolve, reject) => {
    const existing = document.querySelector(`script[src="${src}"]`);
    if (existing) { existing.addEventListener("load", resolve); existing.addEventListener("error", reject); return; }
    const tag = document.createElement("script");
    tag.src = src;
    tag.onload = resolve;
    tag.onerror = () => reject(new Error("Could not load Square."));
    document.head.appendChild(tag);
  });
}

async function mountSquareCard() {
  const container = document.getElementById("square-card-container");
  if (!container || backend.card) return;

  try {
    const cfg = await loadConfig();
    await loadSquareSdk(cfg.squareEnv);
    if (!window.Square) throw new Error("Square could not be reached.");
    const payments = window.Square.payments(cfg.squareApplicationId, cfg.squareLocationId);
    const card = await payments.card();
    container.innerHTML = "";
    container.style.border = "1px solid rgba(255,255,255,.14)";
    container.style.color = "#fff";
    await card.attach("#square-card-container");
    backend.card = card;
    backend.payments = payments;
  } catch (e) {
    container.innerHTML = `<span style="color:#FF2EA0">Card entry is unavailable: ${e.message}</span>`;
  }
}

/* Tokenizes the card. Square returns a single-use token plus, for SCA
   flows, a verification token that must accompany it. */
async function tokenizeCard(amountCents) {
  if (!backend.card) throw new Error("Card details aren't ready yet.");
  const result = await backend.card.tokenize();
  if (result.status !== "OK") {
    throw new Error(result.errors?.[0]?.message || "Please check your card details.");
  }

  let verificationToken;
  try {
    const verify = await backend.payments.verifyBuyer(result.token, {
      amount: (amountCents / 100).toFixed(2),
      currencyCode: "USD",
      intent: "CHARGE_AND_STORE",
      billingContact: { postalCode: state.pay.zip || undefined },
    });
    verificationToken = verify?.token;
  } catch {
    // verifyBuyer is only required for SCA-regulated cards; a failure
    // here must not block an otherwise valid US card.
  }
  return { sourceId: result.token, verificationToken };
}

/* The TOS text as the client actually saw it — path-conditional, and
   including the "pending Michael's confirmation" disclaimers, since
   those were part of the document presented. Stored verbatim as the
   legal record of what was agreed to. */
function renderedTosText(path) {
  const holder = document.createElement("div");
  /* Insert a break at every block boundary before reading textContent —
     otherwise adjacent elements concatenate ("...AGREEMENTThese Terms...")
     and the stored record, which is what gets read back in a dispute,
     comes out as one unbroken wall of text. */
  holder.innerHTML = renderTosDocument(path)
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/(p|div|h[1-6]|li|tr|section)>/gi, "\n\n");
  return holder.textContent
    .replace(/[ \t]+/g, " ")
    .replace(/ *\n */g, "\n")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

const TOS_REV = "2026-07-28";

// ---------------------------------------------------------------------
// PRICING CALCULATIONS
// ---------------------------------------------------------------------
function computePricing() {
  const pkg = state.pkg, path = pkg.path;

  const launchBase = PRICING.LAUNCH_BASE_PRICES[pkg.launch.episodes] * PRICING.LAUNCH_LENGTH_MULTIPLIERS[pkg.launch.lengthMin];
  const scriptingCost = pkg.launch.scripting ? PRICING.SCRIPT_RATES_PER_EPISODE[pkg.launch.lengthMin] * pkg.launch.episodes : 0;
  const launchTotal = launchBase + scriptingCost;

  const entryMonthly = path === "postcast" ? PRICING.POSTCAST_MONTHLY : path === "webicast" ? PRICING.WEBICAST_MONTHLY : 0;
  const entryOneTime = path === "audit" ? auditPrice : 0;

  const orbitMonthly = path === "launch" ? (PRICING.ORBIT_TIERS[pkg.orbit.tier].monthly + PRICING.HOST_ADDERS[pkg.orbit.voice]) : 0;

  const web = pkg.pods.web;
  const webBucket = lengthBucket(pkg.launch.lengthMin);
  const webBase = web.enabled ? PRICING.WEB_BASE_RATES[web.freq][webBucket] : 0;
  const freqPerMonth = Number(web.freq);
  const webAddons = web.enabled ? (
    (web.transcripts ? PRICING.WEB_ADDON_RATES.transcript * freqPerMonth : 0) +
    (web.embeddedPlayers ? PRICING.WEB_ADDON_RATES.embeddedPlayer * freqPerMonth : 0) +
    (web.embeddedVideo ? PRICING.WEB_ADDON_RATES.embeddedVideo * freqPerMonth : 0) +
    ((PRICING.BLOG_LENGTH_OPTIONS.find(o => o.value === web.blogLength) || {}).adder || 0) * freqPerMonth
  ) : 0;
  const webMonthly = webBase + webAddons;

  const social = pkg.pods.social;
  const socialMonthly = social.enabled ? PRICING.SOCIAL_CLIP_RATES[social.clips] * social.clips : 0;

  const production = pkg.pods.production;
  const productionMonthly = production.enabled ? PRICING.PRODUCTION_RATES[pkg.launch.lengthMin] * production.freq : 0;

  const boost = pkg.pods.boost;
  const boostMgmt = boost.enabled ? PRICING.BOOST_AD_RATES[boost.adsPerMo] : 0;
  const boostAdSpend = boost.enabled ? Number(boost.adSpend || 0) : 0;

  const discountable = entryMonthly + webMonthly + socialMonthly + productionMonthly + boostMgmt;
  const planDiscount = (PRICING.DISCOUNTS.find(d => d.key === pkg.paymentPlan) || {}).rate || 0;
  const planDiscountAmt = discountable * planDiscount;

  /* promoApplied is whatever /api/promo/validate returned — a real row
     from the promo_codes table, which may be a percentage (basis points)
     or a flat amount (cents). It is NOT a key into PRICING.DISCOUNTS:
     that list is payment-plan terms, and matching codes against it made
     the preview disagree with what checkout would charge. */
  const promo = pkg.promoApplied;
  const promoDiscountAmt = !promo ? 0
    : promo.discountType === "percent" ? discountable * (promo.amount / 10000)
    : promo.amount / 100;

  // Mirrors the server: additive, but never more than the base, so a
  // large flat code cannot render a negative total.
  const discAmount = Math.min(planDiscountAmt + promoDiscountAmt, discountable);

  const recurringTotal = orbitMonthly + discountable - discAmount + boostAdSpend;
  const chargedToday = path === "launch"
    ? launchTotal
    : (entryOneTime + entryMonthly + webMonthly + socialMonthly + productionMonthly + boostMgmt - discAmount + boostAdSpend);

  const lineItems = [];
  if (path === "launch") {
    lineItems.push({ label: `Launch (one-time, ${pkg.launch.episodes} eps · ${pkg.launch.lengthMin}m)`, amount: fmt(launchBase) });
    if (pkg.launch.scripting) lineItems.push({ label: "Scripting add-on", amount: fmt(scriptingCost) });
    lineItems.push({ label: `Orbit (${PRICING.ORBIT_TIERS[pkg.orbit.tier].label})`, amount: fmt(orbitMonthly) + "/mo" });
  }
  if (path === "postcast") lineItems.push({ label: "Postcast", amount: fmt(entryMonthly) + "/mo" });
  if (path === "webicast") lineItems.push({ label: "Webicast", amount: fmt(entryMonthly) + "/mo" });
  if (path === "audit") lineItems.push({ label: "Podcast Audit (one-time)", amount: fmt(auditPrice) });
  if (web.enabled) lineItems.push({ label: "Web Pod", amount: fmt(webMonthly) + "/mo" });
  if (social.enabled) lineItems.push({ label: `Social Pod (${social.clips} clips)`, amount: fmt(socialMonthly) + "/mo" });
  if (production.enabled) lineItems.push({ label: "Production Pod", amount: fmt(productionMonthly) + "/mo" });
  if (boost.enabled) lineItems.push({ label: "Boost Pod mgmt", amount: fmt(boostMgmt) + "/mo" });
  if (boost.enabled) lineItems.push({ label: "Boost ad spend (passthrough)", amount: fmt(boostAdSpend) + "/mo" });
  if (discAmount > 0) {
    const labels = [];
    if (planDiscount) labels.push(PRICING.DISCOUNTS.find(d => d.key === pkg.paymentPlan).label);
    if (promo) labels.push(`Code ${promo.code.toUpperCase()}`);
    lineItems.push({ label: `Discount (${labels.join(" + ")})`, amount: "−" + fmt(discAmount) });
  }

  return { launchTotal, entryMonthly, entryOneTime, orbitMonthly, webMonthly, socialMonthly, productionMonthly,
    boostMgmt, boostAdSpend, recurringTotal, chargedToday, lineItems };
}

// ---------------------------------------------------------------------
// RENDER HELPERS
// ---------------------------------------------------------------------
const root = document.getElementById("lpm-root");
function render() {
  root.innerHTML = renderScreen();
  bindEvents();
  // The card iframe must be attached after the step's markup exists, and
  // re-attached whenever a re-render replaces the container.
  if (state.screen === "wizard") {
    const steps = stepsFor(state.pkg.path);
    if (steps[state.wizardStep] === "payment") mountSquareCard();
  }
}

  return `cursor:pointer;padding:14px 12px;border-radius:12px;text-align:center;transition:all .15s ease;border:1px solid ${active ? "rgba(110,43,242,.8)" : "rgba(255,255,255,.12)"};background:${active ? "linear-gradient(160deg,rgba(110,43,242,.32),rgba(18,200,216,.14))" : "rgba(255,255,255,.03)"};font:500 13px "Instrument Sans",sans-serif;color:#fff${extra || ""}`;
}
function cardSelect(active) {
  return `cursor:pointer;padding:22px;border-radius:16px;transition:all .15s ease;border:1px solid ${active ? "rgba(110,43,242,.75)" : "rgba(255,255,255,.1)"};background:${active ? "linear-gradient(155deg,rgba(255,46,160,.12),rgba(110,43,242,.14))" : "rgba(255,255,255,.03)"}`;
}
function chip(active) {
  return `cursor:pointer;padding:9px 14px;border-radius:100px;font:500 12px "Instrument Sans",sans-serif;border:1px solid ${active ? "rgba(18,200,216,.7)" : "rgba(255,255,255,.15)"};background:${active ? "rgba(18,200,216,.16)" : "transparent"};color:#fff`;
}
function toggleStyle(on) { return `width:42px;height:24px;border-radius:100px;position:relative;transition:background .15s ease;background:${on ? "#12C8D8" : "rgba(255,255,255,.18)"}`; }
function knobStyle(on) { return `position:absolute;top:3px;left:${on ? "21px" : "3px"};width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s ease`; }
const inputStyle = `width:100%;box-sizing:border-box;padding:13px 14px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.14);color:#fff;font:400 15px "Instrument Sans",sans-serif`;
const labelStyle = `font:700 10px "Space Mono",monospace;letter-spacing:.12em;color:rgba(255,255,255,.5);display:block;margin-bottom:7px`;

function stepsFor(path) {
  return path === "launch"
    ? ["path", "launch", "orbit", "pods", "discounts", "review", "tos", "payment", "success"]
    : ["path", "entry", "pods", "discounts", "review", "tos", "payment", "success"];
}
const STEP_LABELS = { path: "Choose path", launch: "Configure Launch", entry: "Configure package", orbit: "Choose Orbit", pods: "Add Pods", discounts: "Discounts", review: "Review", tos: "Terms", payment: "Payment", success: "Done" };

  const isLogin = state.screen === "login";
  return `
  <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">

      <div style="text-align:center;margin-bottom:36px">

        <div style="font:700 11px 'Space Mono',monospace;letter-spacing:.2em;color:rgba(255,255,255,.5)">${isLogin ? "CLIENT PORTAL" : "CREATE ACCOUNT"}</div>

function renderTopBar() {
  return `
  <div class="lpm-pad-h" style="display:flex;align-items:center;justify-content:space-between;padding:22px 40px;border-bottom:1px solid rgba(255,255,255,.08)">
    <div style="display:flex;align-items:center;gap:16px">
      <span style="font:700 22px/1 'Space Grotesk',sans-serif;letter-spacing:-.02em;background:linear-gradient(95deg,#FF2EA0,#6E2BF2 55%,#12C8D8);-webkit-background-clip:text;background-clip:text;color:transparent">LPM</span>
      <span style="width:1px;height:18px;background:rgba(255,255,255,.14)"></span>
      <span style="font:500 14px 'Instrument Sans',sans-serif;color:rgba(255,255,255,.6)">Client Portal</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px">
      <span style="font:500 14px 'Instrument Sans',sans-serif;color:rgba(255,255,255,.55)">${state.loginEmail || state.auth.email}</span>
      <button data-action="doLogout" style="cursor:pointer;font:500 13px 'Instrument Sans',sans-serif;color:rgba(255,255,255,.7);padding:9px 16px;border-radius:100px;border:1px solid rgba(255,255,255,.18);background:transparent">Log out</button>
    </div>
  </div>`;
}

function renderWizard() {
  const pkg = state.pkg, path = pkg.path;
  const steps = stepsFor(path);
  const stepId = steps[Math.min(state.wizardStep, steps.length - 1)];
  const p = computePricing();

  const progressDots = steps.slice(0, 7).map((_, i) => `<div style="width:32px;height:4px;border-radius:2px;background:${i <= state.wizardStep ? "linear-gradient(95deg,#FF2EA0,#6E2BF2,#12C8D8)" : "rgba(255,255,255,.12)"}"></div>`).join("");

  let stepHtml = "";
  if (stepId === "path") stepHtml = renderStepPath();
  else if (stepId === "launch") stepHtml = renderStepLaunch();
  else if (stepId === "entry") stepHtml = renderStepEntry();
  else if (stepId === "orbit") stepHtml = renderStepOrbit();
  else if (stepId === "pods") stepHtml = renderStepPods(p);
  else if (stepId === "discounts") stepHtml = renderStepDiscounts();
  else if (stepId === "review") stepHtml = renderStepReview(p);
  else if (stepId === "tos") stepHtml = renderStepTos();
  else if (stepId === "payment") stepHtml = renderStepPayment();
  else if (stepId === "success") stepHtml = renderStepSuccess(p);

  const showSummary = stepId !== "success";
  const showNav = stepId !== "success";
  const nextDisabled = (stepId === "path" && !path) || (stepId === "tos" && !state.tosAccepted);
  const nextLabel = stepId === "tos" ? "Continue to payment" : stepId === "payment" ? "Pay & confirm" : stepId === "review" ? "Accept & continue" : "Continue →";

  return `
  ${renderTopBar()}
  <div class="lpm-pad-h" style="padding:34px 40px 100px">
    ${state.editMode ? `
    <div style="display:flex;gap:12px;align-items:flex-start;padding:16px 20px;border-radius:14px;background:rgba(255,46,160,.1);border:1px solid rgba(255,46,160,.35);margin-bottom:26px">
      <span style="font-size:16px">⚠</span>
      <div style="font:400 14px/1.55 'Instrument Sans',sans-serif;color:rgba(255,255,255,.82)">You're editing an active package. Changes to production, video, or content Pods take up to <strong>30 days</strong> to appear in delivered assets. Billing changes apply on your next cycle.</div>
    </div>` : ""}
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">${progressDots}</div>
    <div style="font:700 11px 'Space Mono',monospace;letter-spacing:.16em;color:rgba(255,255,255,.45);margin-bottom:30px">STEP ${state.wizardStep + 1} / ${steps.length} · ${STEP_LABELS[stepId]}</div>
    <div class="lpm-wiz-grid" style="display:grid;grid-template-columns:1fr 360px;gap:40px;align-items:start">
      <div>${stepHtml}</div>
      ${showSummary ? renderSummaryCol(p) : ""}
    </div>
    ${showNav ? `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:40px;max-width:calc(100% - 400px)">
      <button data-action="goBack" ${state.wizardStep === 0 ? "disabled" : ""} style="cursor:pointer;font:600 14px 'Instrument Sans',sans-serif;color:rgba(255,255,255,.7);padding:13px 26px;border-radius:100px;border:1px solid rgba(255,255,255,.2);background:transparent${state.wizardStep === 0 ? ";opacity:.35;pointer-events:none" : ""}">← Back</button>
      <button data-action="goNext" ${nextDisabled ? "disabled" : ""} style="cursor:pointer;font:600 14px 'Instrument Sans',sans-serif;color:#08060f;padding:13px 30px;border-radius:100px;border:none;background:#fff${nextDisabled ? ";opacity:.4;pointer-events:none" : ""}">${nextLabel}</button>
    </div>` : ""}
  </div>`;
}

function renderSummaryCol(p) {
  return `
  <div class="lpm-summary-col" style="position:sticky;top:20px;padding:24px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1)">
    <div style="font:700 11px 'Space Mono',monospace;letter-spacing:.14em;color:rgba(255,255,255,.5);margin-bottom:14px">YOUR PACKAGE</div>
    ${p.lineItems.map(l => `<div style="display:flex;align-items:baseline;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)"><span style="font:400 13px 'Instrument Sans',sans-serif;color:rgba(255,255,255,.7)">${l.label}</span><span style="font:600 14px 'Space Grotesk',sans-serif">${l.amount}</span></div>`).join("")}
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)">
      <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font:500 13px 'Instrument Sans',sans-serif;color:rgba(255,255,255,.6)">Due today</span><span style="font:700 20px 'Space Grotesk',sans-serif">${fmt(p.chargedToday)}</span></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:6px"><span style="font:500 13px 'Instrument Sans',sans-serif;color:rgba(255,255,255,.6)">Then monthly</span><span style="font:600 15px 'Space Grotesk',sans-serif;color:rgba(255,255,255,.8)">${fmt(p.recurringTotal)}/mo</span></div>
    </div>
  </div>`;
}

function renderStepPath() {
  const paths = [
    { key: "launch", label: "Full Launch System", tag: "FULL BUILD", desc: "Strategy, brand, recording, distribution — built from scratch over 6–8 weeks." },
    { key: "postcast", label: "Postcast", tag: fmt(PRICING.POSTCAST_MONTHLY) + "/MO FLAT", desc: "Your best blog content, remixed into a real audio show — one flat monthly rate." },
    { key: "webicast", label: "Webicast", tag: fmt(PRICING.WEBICAST_MONTHLY) + "/MO FLAT", desc: "Turn an existing webinar recording into a polished podcast — one flat monthly rate." },
    { key: "audit", label: "Podcast Audit", tag: fmt(auditPrice) + " ONE-TIME", desc: "A flat-fee, standalone review of your existing show — no recurring commitment." },
  ];
  const selected = paths.find(o => o.key === state.pkg.path) || paths[0];
  return `
    <h2 style="font:600 34px/1.1 'Space Grotesk',sans-serif;letter-spacing:-.02em;margin:0 0 10px">Choose how you start.</h2>
    <p style="font:400 16px/1.6 'Instrument Sans',sans-serif;color:rgba(255,255,255,.6);margin:0 0 24px;max-width:520px">The full Launch system builds your show from scratch. Postcast and Webicast turn content you already have into a podcast — lower lift, faster to live.</p>
    <div style="display:flex;flex-direction:column;gap:14px;max-width:460px">
      ${paths.map(o => `
        <div data-action="setPath" data-value="${o.key}" style="${cardSelect(state.pkg.path === o.key)}">
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="font:600 18px 'Space Grotesk',sans-serif">${o.label}</div>
            <div style="font:600 12px 'Instrument Sans',sans-serif;color:rgba(255,255,255,.6)">${o.tag}</div>
          </div>
        </div>`).join("")}
    </div>
    <div style="margin-top:20px;padding:20px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);max-width:460px">
      <div style="font:400 14px/1.55 'Instrument Sans',sans-serif;color:rgba(255,255,255,.65)">${selected.desc}</div>
    </div>`;
}

  return `
    <h2 style="font:600 34px/1.1 'Space Grotesk',sans-serif;letter-spacing:-.02em;margin:0 0 26px">Configure your Launch.</h2>

    <div class="lpm-opt-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px">

        <div data-action="setLaunchEpisodes" data-value="${n}" style="${pill(l.episodes === n)}">

          <div style="font:400 13px 'Instrument Sans',sans-serif;color:rgba(255,255,255,.55);margin-top:2px">${fmt(PRICING.LAUNCH_BASE_PRICES[n])}</div>

    <div class="lpm-opt-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px">
      ${PRICING.RECORDING_LOCATIONS.map(o => `
        <div data-action="setLaunchLocation" data-value="${o.value}" style="${pill(l.location === o.value)}">
          <div style="font:600 15px 'Space Grotesk',sans-serif">${o.label}</div>
          <div style="font:400 12px 'Instrument Sans',sans-serif;color:rgba(255,255,255,.5);margin-top:3px">${o.note}</div>
        </div>`).join("")}
    </div>

        <div>
          <div style="font:600 16px 'Space Grotesk',sans-serif">Add professional scripting</div>

        <div style="${toggleStyle(scripting)}"><div style="${knobStyle(scripting)}"></div></div>
      </div>
      ${scripting ? `<div style="font:600 14px 'Instrument Sans',sans-serif;color:#12C8D8;margin-top:10px">+${fmt(scriptingCost)} total (${fmt(PRICING.SCRIPT_RATES_PER_EPISODE[l.lengthMin])}/ep × ${l.episodes} eps)</div>` : ""}

}

function renderStepEntry() {
  const path = state.pkg.path;
  const title = path === "postcast" ? "Configure Postcast." : path === "webicast" ? "Configure Webicast." : "Podcast Audit.";
  const desc = path === "postcast" || path === "webicast" ? "One flat monthly rate." : "A one-time flat fee — no recurring commitment.";
  let card = "";
  if (path === "postcast") card = `<div style="padding:24px;border-radius:16px;background:rgba(18,200,216,.1);border:1px solid rgba(18,200,216,.4)"><div style="display:flex;align-items:baseline;gap:10px"><div style="font:600 18px 'Space Grotesk',sans-serif">Postcast</div><div style="font:600 24px 'Space Grotesk',sans-serif">${fmt(PRICING.POSTCAST_MONTHLY)}<span style="font:400 13px 'Instrument Sans',sans-serif;color:rgba(255,255,255,.5)">/mo flat</span></div></div><div style="font:400 14px/1.6 'Instrument Sans',sans-serif;color:rgba(255,255,255,.6);margin-top:8px">Your best blog and written content, remixed into a real audio show.</div></div>`;
  if (path === "webicast") card = `<div style="padding:24px;border-radius:16px;background:rgba(110,43,242,.1);border:1px solid rgba(110,43,242,.4)"><div style="display:flex;align-items:baseline;gap:10px"><div style="font:600 18px 'Space Grotesk',sans-serif">Webicast</div><div style="font:600 24px 'Space Grotesk',sans-serif">${fmt(PRICING.WEBICAST_MONTHLY)}<span style="font:400 13px 'Instrument Sans',sans-serif;color:rgba(255,255,255,.5)">/mo flat</span></div></div><div style="font:400 14px/1.6 'Instrument Sans',sans-serif;color:rgba(255,255,255,.6);margin-top:8px">Turn your existing webinar recordings into a polished podcast.</div></div>`;
  if (path === "audit") card = `<div style="padding:24px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.14)"><div style="display:flex;align-items:baseline;gap:10px"><div style="font:600 18px 'Space Grotesk',sans-serif">Podcast Audit</div><div style="font:600 24px 'Space Grotesk',sans-serif">${fmt(auditPrice)}<span style="font:400 13px 'Instrument Sans',sans-serif;color:rgba(255,255,255,.5)"> one-time</span></div></div><div style="font:400 14px/1.6 'Instrument Sans',sans-serif;color:rgba(255,255,255,.6);margin-top:8px">A one-time, flat-fee review of your existing show.</div></div>`;

          <div style="font:400 11px 'Instrument Sans',sans-serif;color:rgba(255,255,255,.5);margin-top:3px">${PRICING.HOST_ADDERS[opt.value] ? "+$" + PRICING.HOST_ADDERS[opt.value] : "included"}</div>
        </div>`).join("")}
    </div>`;
}

  const bucket = lengthBucket(state.pkg.launch.lengthMin);

function renderStepDiscounts() {
  const plans = [{ key: "monthly", label: "Monthly", desc: "No commitment, cancel any time.", rate: 0 },
    ...PRICING.DISCOUNTS.filter(d => d.key === "full_year" || d.key === "six_months")];
  const pkg = state.pkg;
  return `
    <h2 style="font:600 34px/1.1 'Space Grotesk',sans-serif;letter-spacing:-.02em;margin:0 0 10px">How do you want to pay?</h2>
    <p style="font:400 16px/1.6 'Instrument Sans',sans-serif;color:rgba(255,255,255,.6);margin:0 0 28px;max-width:520px">Applies to your recurring Pod total — paying upfront saves you money.</p>
    <div style="display:flex;flex-direction:column;gap:12px;max-width:460px;margin-bottom:32px">
      ${plans.map(o => { const on = pkg.paymentPlan === o.key; return `
        <div data-action="setPaymentPlan" data-value="${o.key}" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 18px;border-radius:12px;border:1px solid ${on ? "rgba(18,200,216,.6)" : "rgba(255,255,255,.12)"};background:${on ? "rgba(18,200,216,.1)" : "rgba(255,255,255,.03)"}">
          <div><div style="font:600 15px 'Instrument Sans',sans-serif">${o.desc ? o.label : o.label}</div><div style="font:400 13px 'Instrument Sans',sans-serif;color:rgba(255,255,255,.55);margin-top:3px">${o.desc || "Pay for the term upfront."}</div></div>
          ${o.rate ? `<div style="font:600 15px 'Space Grotesk',sans-serif;color:#12C8D8;white-space:nowrap">−${Math.round(o.rate * 100)}%</div>` : ""}
        </div>`; }).join("")}
    </div>
    <div style="font:700 11px 'Space Mono',monospace;letter-spacing:.14em;color:rgba(255,255,255,.5);margin-bottom:10px">HAVE A PROMO CODE?</div>
    <div style="display:flex;gap:10px;max-width:400px">
      <input type="text" id="promoCodeInput" placeholder="Enter code" value="${pkg.promoCodeInput}" style="flex:1;box-sizing:border-box;padding:13px 14px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.16);color:#fff;font:400 14px 'Instrument Sans',sans-serif"/>
      <button data-action="applyPromoCode" style="cursor:pointer;font:600 13px 'Instrument Sans',sans-serif;color:#fff;padding:0 20px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:transparent">Apply</button>
    </div>
    ${pkg.promoApplied ? `<div style="font:500 13px 'Instrument Sans',sans-serif;margin-top:10px;color:#12C8D8">✓ "${pkg.promoApplied.code.toUpperCase()}" applied — ${pkg.promoApplied.discountType === "percent" ? (pkg.promoApplied.amount / 100) + "% off" : fmt(pkg.promoApplied.amount / 100) + " off"}</div>` : pkg.promoError ? `<div style="font:500 13px 'Instrument Sans',sans-serif;margin-top:10px;color:#FF2EA0">Code not recognized.</div>` : ""}`;
}

function renderStepReview(p) {
  return `
    <h2 style="font:600 34px/1.1 'Space Grotesk',sans-serif;letter-spacing:-.02em;margin:0 0 10px">Review your package.</h2>
    <p style="font:400 16px/1.6 'Instrument Sans',sans-serif;color:rgba(255,255,255,.6);margin:0 0 26px;max-width:560px">Here's the split between what's charged today and what starts recurring.</p>
    <div style="padding:26px;border-radius:18px;background:linear-gradient(155deg,rgba(255,46,160,.1),rgba(110,43,242,.08));border:1px solid rgba(110,43,242,.4);margin-bottom:18px">
      <div style="font:700 11px 'Space Mono',monospace;letter-spacing:.14em;color:rgba(255,255,255,.55);margin-bottom:10px">CHARGED TODAY</div>
      <div style="font:600 40px 'Space Grotesk',sans-serif;letter-spacing:-.02em">${fmt(p.chargedToday)}</div>
    </div>
    <div style="padding:26px;border-radius:18px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.09);margin-bottom:18px">
      <div style="font:700 11px 'Space Mono',monospace;letter-spacing:.14em;color:rgba(255,255,255,.5);margin-bottom:10px">RECURRING MONTHLY (STARTS LATER)</div>
      <div style="font:600 34px 'Space Grotesk',sans-serif;letter-spacing:-.02em;margin-bottom:16px">${fmt(p.recurringTotal)}<span style="font:400 14px 'Instrument Sans',sans-serif;color:rgba(255,255,255,.5)">/mo</span></div>
      ${p.lineItems.map(l => `<div style="display:flex;align-items:baseline;justify-content:space-between;padding:10px 0;border-top:1px solid rgba(255,255,255,.08)"><span style="font:400 14px 'Instrument Sans',sans-serif;color:rgba(255,255,255,.75)">${l.label}</span><span style="font:600 15px 'Space Grotesk',sans-serif">${l.amount}</span></div>`).join("")}
    </div>
    <div style="font:400 13px/1.6 'Instrument Sans',sans-serif;color:rgba(255,255,255,.45)">Production changes made after this point take up to 30 days to appear in delivered assets.</div>`;
}

  { text: `LAUNCHPOD Ownership.  LAUNCHPOD will retain exclusive ownership of all intellectual property rights in all of its know-how, concepts, techniques, methodologies, processes, service marks, copyrights and copyrightable works, trade secrets, data and formulas, and all updates, modifications, improvements, enhancements and derivative works of the same created or developed (i) prior to or apart from this Agreement or (ii) during the Term and that were not developed or conceived specifically for CLIENT or under this Agreement or any applicable SOW as part of the Services as set forth in Section 4.2 above.`, bold: false, applies: "all" },
  { text: `Confidentiality.`, bold: false, applies: "all" },
  { text: `Confidential Treatment.  Each Party acknowledges that “Confidential Information” (as defined below) may be disclosed to the other Party during the Term. Each Party agrees to: (i) not disclose or reveal the Confidential Information of the other Party to any third party and not reproduce or distribute such Confidential Information in any form, tangible or otherwise, except as allowed by the terms of this Agreement; and (ii) restrict access to all such Confidential Information to its employees and contractors who have a need to know in order to perform the obligations of the relevant Party under this Agreement, and each Party shall inform any such employees or contractors of the existence, importance and terms of this Agreement relating to such Confidential Information and require them to maintain such Confidential Information in accordance with the terms of this Agreement. For purposes of this Agreement, “Confidential Information” shall mean all confidential and proprietary information of a Party disclosed to or made available to the other Party that (x) if disclosed orally is designated as confidential at the time of disclosure or reasonably thereafter, (y) if disclosed in writing is marked as “Confidential” and/or “Proprietary” or with similar markings, or (z) even if not identified as Confidential, reasonably should be understood to be confidential given the nature of the information and the circumstances of disclosure including, but not limited to, the terms and conditions of this Agreement and/or of provision of the Services.`, bold: false, applies: "all" },
  { text: `Treatment of Non-Confidential Client Material.  CLIENT recognizes that it is fundamental to the performance of the Services for LAUNCHPOD to disseminate information about CLIENT’s business, services and products to the media and other third parties. Any Client Material that is not Confidential Information will be treated by LAUNCHPOD as non-confidential and may be disseminated by LAUNCHPOD pursuant to the terms of this Agreement.`, bold: false, applies: "all" },
  { text: `Exceptions.  Nothing in this Agreement will impose a confidentiality obligation on either Party with respect to information or material that the receiving Party can show: (i) is rightfully in the public domain without any breach by the receiving Party, but only from the date that it entered the public domain other than by or through the other Party; (ii) is rightfully received from a third party without any obligation of confidentiality; (iii) is rightfully known to the receiving Party without any obligation of confidentiality prior to its receipt from the disclosing Party; (iv) is independently developed by employees of the receiving Party without use of the disclosing Party’s Confidential Information; (v) is made generally available to third parties by the disclosing Party without restrictions on disclosure; or (vi) is required to be disclosed under applicable law or governmental rules or regulations (including, without limitation, federal or state securities laws, rules and regulations), provided that the receiving Party gives to the disclosing Party reasonable advance notice in writing of the need for disclosure.`, bold: false, applies: "all" },
  { text: `Specific Performance.  If either Party breaches any covenant set forth in this Section 5, such breach may cause irreparable harm to the other Party and, in the event of such breach, such Party shall be entitled, in addition to seeking monetary damages and to any other remedies available to such Party under this Agreement and at law, to seek equitable relief, including injunctive relief.`, bold: false, applies: "all" },
  { text: `Warranties.`, bold: false, applies: "all" },
  { text: `Warranties of CLIENT.`, bold: false, applies: "all" },
  { text: `Content Responsibility.  CLIENT represents and warrants that it either owns or has obtained all rights to use and commercially publish or distribute the Client Materials and that to CLIENT’s knowledge, all the Client Materials are accurate and do not infringe on any other person’s intellectual property. CLIENT acknowledges and agrees that LAUNCHPOD has no responsibility to validate the accuracy or correctness of any claims made in any Client Materials, and that CLIENT shall indemnify LAUNCHPOD in accordance with Section 7.1 for any Loss (as defined in Section 7.1) LAUNCHPOD incurs based on a breach of this warranty in this Section 6.1(a).`, bold: false, applies: "all" },
  { text: `Publicity.  LAUNCHPOD may, in its discretion, issue a press release after the Effective Date, announcing that CLIENT is using LAUNCHPOD’s Services, and containing a quote that is complimentary of LAUNCHPOD and/or the Services from a senior executive of CLIENT. LAUNCHPOD will provide a draft of, and obtain CLIENT’s prior written approval of, such quote before its release. As set forth in Section 4.2 above, LAUNCHPOD may also include CLIENT’s name and trademark(s) in communications with third parties and the general public regarding the Services provided by LAUNCHPOD to CLIENT.`, bold: false, applies: "all" },
  { text: `Warranties of LAUNCHPOD.`, bold: false, applies: "all" },
  { text: `Limited Warranty.  LAUNCHPOD represents and warrants that: (A) LAUNCHPOD will provide the Services with skill and care in accordance with a standard to be expected from a competent and professional provider of public relations services; (B) the Services will be provided in accordance with the specifications set forth in this Agreement and applicable SOW; and (C) the Services will substantially comply with all laws and regulations and will not knowingly infringe on the proprietary rights of any third party. LAUNCHPOD will not publish any materials that it knows or has reason to believe has errors or is misleading, offensive or infringes on third-party intellectual property; provided, however, LAUNCHPOD shall not have a duty to investigate the foregoing.`, bold: false, applies: "all" },
  { text: `Disclaimer of Warranties.  Except for the limited warranties set forth in this Agreement, THE SERVICES ARE PROVIDED ‘AS-IS’ WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING, BUT NOT LIMITED TO, WARRANTIES OF PERFORMANCE, MERCHANTABILITY, OR FITNESS FOR A PARTICULAR PURPOSE.`, bold: false, applies: "all" },
  { text: `Indemnity.`, bold: false, applies: "all" },
  { text: `Mutual Indemnification.  Each Party (the “Indemnifying Party”) hereby agrees to indemnify and hold harmless the other Party (the “Indemnified Party”) and its subsidiaries and affiliates, and their respective directors, officers, employees, agents, shareholders, partners, members and other owners, against any and all claims, actions, demands, liabilities, losses, damages, judgments, settlements, costs and expenses, including reasonable attorneys’ fees (any or all of the foregoing hereinafter referred to as “Losses”), to the extent such Losses (or actions in respect thereof) result from (i) a breach of warranties, representations or covenants set forth in this Agreement, (ii) negligent or willful acts and/or omissions caused by the Indemnifying Party’s employees, agents or permitted subcontractors under this Agreement, and (iii) infringement of any third-party intellectual property right, including, but not limited to, patents, trademarks, copyrights or trade secrets; provided that, with respect to LAUNCHPOD as the Indemnifying Party, clause (ii) above shall apply only to the extent such acts or omissions constitute gross negligence or willful misconduct.`, bold: false, applies: "all" },
  { text: `Indemnification by CLIENT.  CLIENT agrees to indemnify and hold LAUNCHPOD and its directors, officers, employees, agents and shareholders harmless from any claims by third parties brought against CLIENT or LAUNCHPOD that are based upon information or materials supplied by CLIENT.`, bold: false, applies: "all" },
  { text: `Indemnification by LAUNCHPOD.  LAUNCHPOD agrees to indemnify and hold CLIENT and its directors, officers, employees, agents and shareholders harmless from any claims by third parties brought against CLIENT that are based upon information or materials supplied by LAUNCHPOD.`, bold: false, applies: "all" },
  { text: `Indemnification Procedure.  The indemnification obligations set forth in Sections 7.1 through 7.3 above are contingent upon the following conditions: (i) the Indemnified Party must promptly notify the Indemnifying Party in writing of the claim; however, failure of the Indemnified Party to so promptly notify the Indemnifying Party will not relieve the Indemnifying Party of its indemnification obligations hereunder, except to the extent it has been damaged thereby; (ii) the Indemnified Party must reasonably cooperate with the Indemnifying Party in the defense of the matter; and (iii) the Indemnifying Party will have primary control of the defense of the action and negotiations for its settlement and compromise; provided, however, that: (A) the Indemnified Party will have the right to approve any settlement or compromise that will impose any obligation upon it or that may adversely affect its rights under this Agreement or its rights to any of the Indemnified Party’s materials subject to copyright, patent, trade secret or trademark protection; and (B) the Indemnified Party may, at its own cost, obtain separate counsel to represent its interests.`, bold: false, applies: "all" },
  { text: `Limitation of Liabilities.`, bold: false, applies: "all" },
  { text: `Liability for Events Outside of Control.  LAUNCHPOD will not be held liable for any failure or delay in performing the Services or any Losses to CLIENT if such failure, delay or Losses could not have reasonably been anticipated and is caused by events outside of LAUNCHPOD’s reasonable control.`, bold: false, applies: "all" },
  { text: `Damages.  IN NO EVENT SHALL EITHER PARTY BE LIABLE FOR ANY SPECIAL, INDIRECT INCIDENTAL, CONSEQUENTIAL OR PUNITIVE DAMAGES ARISING OUT OF THIS AGREEMENT, HOWEVER CAUSED AND UNDER ANY THEORY OF LIABILITY, INCLUDING DAMAGES RELATING TO LOSS OF PROFITS, INCOME OR BUSINESS, EVEN IF EITHER PARTY HAS BEEN ADVISED, KNEW OR SHOULD HAVE KNOWN OF THE POSSIBILITY OF SUCH DAMAGES.`, bold: false, applies: "all" },
  { text: `Limitations on Liability.  EXCLUDING LAUNCHPOD’S INDEMNIFICATION OBLIGATIONS HEREUNDER, LAUNCHPOD SHALL NOT BE LIABLE FOR ANY DAMAGES TO CLIENT, OR TO ANY AFFILIATED PARTY OF CLIENT FOR BREACH OF THIS AGREEMENT, OR TO ANY AFFILIATED PARTY OF CLIENT, IN EXCESS OF THE AMOUNT ACTUALLY PAID BY CLIENT TO LAUNCHPOD UNDER THIS AGREEMENT DURING THE THREE (3) MONTHS IMMEDIATELY PRECEDING THE EVENT GIVING RISE TO THE CLAIM.`, bold: false, applies: "all" },
  { text: `Termination.`, bold: false, applies: "all" },
  { text: `Termination for Convenience. `, bold: true, applies: "all", flag: "convenience-header" },
  { text: `Launch Package.  CLIENT may not terminate this Agreement for convenience during the Launch Package. If CLIENT terminates this Agreement for convenience before completion of the Launch Package, CLIENT shall pay LAUNCHPOD one hundred percent (100%) of the sum total of the Launch Package fees remaining unpaid as of the date of CLIENT’s notice of termination, which shall be paid no later than thirty (30) calendar days after CLIENT provides LAUNCHPOD written notice of its desire to terminate this Agreement.`, bold: false, applies: "launch" },
  { text: `Orbit Subscription.  Once CLIENT’s Orbit Subscription has commenced, CLIENT may cancel the Orbit Subscription at any time by providing LAUNCHPOD at least thirty (30) calendar days’ prior written notice through the client portal or otherwise. This notice period reflects LAUNCHPOD’s advance production scheduling for CLIENT’s Services and is not a cancellation fee or penalty. Cancellation will be effective at the end of the notice period, and CLIENT will remain responsible for the Fee for each production cycle that begins before the effective date of cancellation.`, bold: false, applies: "launch" },
  { text: `Termination Upon Breach.  At any time, either Party (the “Non-breaching Party”) may terminate this Agreement upon written notice to the other Party in the event the other Party (the “Breaching Party”) breaches a material term or condition of this Agreement and fails to cure such breach within thirty (30) calendar days after receipt of written notice from the Non-breaching Party of the nature of the breach. Notwithstanding the foregoing, where LAUNCHPOD is the Non-breaching Party, the cure period afforded to CLIENT as Breaching Party shall be fifteen (15) calendar days rather than thirty (30) calendar days. However, such cure period shall automatically be extended if the cure for the existing default will take more than thirty (30) calendar days to complete so long as the Breaching Party has initiated action to accomplish such cure, and provided that such cure period shall not extend for a period longer than the commercially reasonable time necessary to accomplish such cure. If LAUNCHPOD is the Breaching Party and CLIENT terminates this Agreement pursuant to this Section 9.2, then any and all fees owed by CLIENT to LAUNCHPOD shall cease to accrue on and after the date of the breach of a material term giving rise to termination so long as CLIENT, upon discovery of such breach, immediately notifies LAUNCHPOD of such breach. CLIENT shall not be entitled to any deliverables and/or services provided by LAUNCHPOD after the date of such breach when fees owed by CLIENT to LAUNCHPOD stop accruing. If CLIENT is the Breaching Party and fails to cure such breach, CLIENT shall pay LAUNCHPOD: (x) if such breach occurs during the Launch Package, one hundred percent (100%) of the sum total of the Launch Package fees remaining unpaid; or (y) if such breach occurs during the Orbit Subscription, an amount equal to the Fee for the production cycle in which the breach occurred plus the Fee for the following production cycle, in either case paid no later than thirty (30) calendar days after the end of the thirty (30) calendar day cure period. LAUNCHPOD may also suspend the Services immediately upon notice of breach and pending cure.`, bold: false, applies: "all", flag: "breach-note" },
  { text: `Procedure upon Termination.  Upon termination of the Agreement for whatever reason: (i) LAUNCHPOD will cease providing the Services and any other deliverables agreed as part of the Services; (ii) LAUNCHPOD will return to CLIENT, at CLIENT’s expense, all Client Material and any Confidential Information of CLIENT; and (iii) except as provided in the last sentence of Section 9.2, CLIENT will be liable to pay all undisputed (so long such dispute is made in good faith) fees for Services rendered and expenses incurred under the Agreement or any SOW; and (iv) LAUNCHPOD will deliver to CLIENT all Content and other deliverables contracted for under the applicable SOW within thirty (30) days after the effective date of termination or expiration (the “Delivery Period”). CLIENT is solely responsible for downloading and independently storing all assets delivered under this Section 9.3(iv). LAUNCHPOD may retain copies of such assets for up to thirty (30) days following the end of the Delivery Period (the “Retention Period”), after which LAUNCHPOD may delete its copies of such assets without further notice to CLIENT.`, bold: false, applies: "all" },
  { text: `Non-Solicitation Agreement.  CLIENT understands and acknowledges that LAUNCHPOD will assign an account team who will be responsible for CLIENT’s account. Such dedication requires LAUNCHPOD to incur certain training, education and other unrecoverable costs. In consideration for such training, education and other cost, CLIENT agrees not to solicit any member of such account team for employment or consulting purposes during the Term and for one (1) year thereafter without LAUNCHPOD’s written consent. CLIENT further agrees to pay liquidated damages of $10,000 per employee hired by CLIENT in the event of a breach of this Section 10.`, bold: false, applies: "all" },
  { text: `Miscellaneous.`, bold: false, applies: "all" },
  { text: `Independent Contractors.  The Parties shall at all times while this Agreement is in effect be independent contractors, and nothing contained in this Agreement shall create or be construed as creating a partnership, joint venture, agency or employment relationship between the Parties. Except as expressly allowed by the terms of the Agreement, neither Party will have the authority to create any contract or obligation binding on the other Party, and neither Party shall be liable, except as expressly provided in this Agreement, for any expenses, liabilities, or other obligations incurred by the other Party.`, bold: false, applies: "all" },
  { text: `Legal Fees.  If any legal action, arbitration or other proceeding is brought for the enforcement of this Agreement, or because of any alleged dispute, breach, default or misrepresentation in connection with this Agreement, the successful or prevailing Party shall be entitled to recover reasonable attorneys’ fees and other costs it incurred in that action or proceeding, in addition to any other relief to which it may be entitled.`, bold: false, applies: "all" },
  { text: `Further Assurances.  Each of the Parties will execute and deliver such additional documents, instruments, conveyances and assurances and take such further actions as may be required to carry out the provisions of this Agreement and give effect to the transactions contemplated hereby.`, bold: false, applies: "all" },
  { text: `Amendments and Waivers. LAUNCHPOD may amend or update this Agreement from time to time by posting the revised Agreement in the client portal or by emailing notice to CLIENT’s Client Representative at least fifteen (15) days before the revised terms take effect. CLIENT’s continued use of the Services, or continuation of the Orbit Subscription, after the effective date of any such revision constitutes CLIENT’s acceptance of the revised Agreement. Any change to CLIENT’s then-current Fee will be made in accordance with, and subject to the notice requirements of, Section 1.9 and Section 3.6. Any other amendment or waiver of this Agreement, and any waiver of a provision of this Section 11.4, must be in a writing signed by both LAUNCHPOD and CLIENT.`, bold: false, applies: "all" },
  { text: `Notices.  All notices, requests, consents, claims, demands, waivers and other communications hereunder shall be in writing and shall be deemed to have been given: (a) when delivered by hand; (b) when received by the addressee if sent by a nationally recognized overnight courier (receipt requested); (c) on the date sent by facsimile (with confirmation of transmission) or email; or (d) on the third day after the date mailed, by certified or registered mail, return receipt requested, postage prepaid. Such communications must be sent to the Party’s contact information set forth in this Agreement (or at such other address as shall be specified by such Party in a notice given in accordance with this Section 11.5).`, bold: false, applies: "all" },
  { text: `Severability.  With respect to any part or provision of this Agreement that is deemed by a court to be unenforceable as written, but may be rendered enforceable by limitation thereof, the Parties agree that such part or provision shall be amended in such a manner as to render it enforceable to the fullest extent permitted under the applicable law. If any term or provision of this Agreement shall be found to be illegal or unenforceable and cannot be amended in such a manner as to render it enforceable, then, notwithstanding such illegality or non-enforceability, the Agreement shall remain in full force and effect and any illegal or unenforceable terms or provisions shall be deemed to be deleted.`, bold: false, applies: "all" },
  { text: `Survival.  Any provisions regarding confidentiality, ownership, payment, indemnification, limitations of liability and any provisions that, by their sense and context are intended to survive performance by either Party or both Parties, shall survive termination of this Agreement.`, bold: false, applies: "all" },
  { text: `Force Majeure.  Except for CLIENT’s payment obligations, if the performance of any part of this Agreement is prevented, hindered, delayed or otherwise made impracticable by reason of any cause or event not within the reasonable control of such Party and without its fault or negligence, that Party shall be excused from such performance to the extent that it is prevented, hindered or delayed by such causes; provided, however, that if such an event prevents LAUNCHPOD from fulfilling its obligations hereunder for thirty (30) days or more, CLIENT may upon written notice to LAUNCHPOD terminate this Agreement.`, bold: false, applies: "all" },
  { text: `Assignment.  This Agreement will be binding upon and will inure to the benefit of the Parties and their respective permitted successors and permitted assigns. Neither Party may assign its rights or delegate its obligations hereunder without the prior written consent of the other Party, which consent may be withheld in the discretion of the other Party; provided that each Party may make such assignment or transfer without the other Party’s consent to such Party’s affiliate or to the successor of all or substantially all of the business of such Party to which this Agreement relates (whether by merger, change of control, acquisition or sale of assets). Any purported assignment or delegation in violation of this Section 11.9 shall be null and void. No assignment or delegation shall relieve the assigning or delegating Party of any of its obligations hereunder.`, bold: false, applies: "all" },
  { text: `No Third-Party Beneficiaries.  This Agreement is for the sole benefit of the Parties and their respective permitted successors and permitted assigns and nothing herein, express or implied, is intended to or shall confer upon any other person or entity any legal or equitable right, benefit or remedy of any nature whatsoever under or by reason of this Agreement.`, bold: false, applies: "all" },
  { text: `Governing Law, Jurisdiction/Venue and Waiver of Jury Trial.  All matters arising out of or related to this Agreement shall be governed by and construed in accordance with the internal laws of the State of Utah without giving effect to any choice or conflict of law provision or rule, whether of the State of Utah or any other jurisdiction. Any legal suit, action or proceeding arising out of or related to this Agreement or the transactions contemplated hereby or thereby, shall be instituted in the federal courts of the United States of America or the courts of the State of Utah, if the federal courts do not have jurisdiction, in each case located in the City of Salt Lake and County of Salt Lake, and each Party irrevocably submits to the exclusive jurisdiction of such courts in any such suit, action or proceeding. The Parties irrevocably and unconditionally waive any objection to personal jurisdiction, the laying of venue of any suit, action or proceeding in such courts, and irrevocably waive and agree not to plead or claim in any such court that any such suit, action or proceeding brought in any such court has been brought in an inconvenient forum. EACH PARTY ACKNOWLEDGES AND AGREES THAT ANY CONTROVERSY WHICH MAY ARISE UNDER THIS AGREEMENT IS LIKELY TO INVOLVE COMPLICATED AND DIFFICULT ISSUES AND, THEREFORE, EACH SUCH PARTY IRREVOCABLY AND UNCONDITIONALLY WAIVES ANY RIGHT IT MAY HAVE TO A TRIAL BY JURY IN RESPECT OF ANY LEGAL ACTION ARISING OUT OF OR RELATING TO THIS AGREEMENT OR THE TRANSACTIONS CONTEMPLATED HEREBY OR THEREBY.`, bold: false, applies: "all" },
  { text: `Construction.  This Agreement shall be construed without regard to any presumption or rule requiring construction or interpretation against the Party drafting an instrument or causing any instrument to be drafted.`, bold: false, applies: "all" },
  { text: `Counterparts.  This Agreement may be executed in any number of counterparts, each of which shall constitute an original.`, bold: false, applies: "all" },
  { text: `Entire Agreement.  This Agreement together with any SOW and all related exhibits and schedules constitutes the entire agreement with respect to the subject matter herein and supersedes all prior or contemporaneous oral or written agreements concerning such subject matter.`, bold: false, applies: "all" },
  { text: `Electronic Acceptance.  CLIENT may accept this Agreement electronically by checking the applicable acceptance box or clicking “I Agree” (or a similar affirmative action) during checkout in the LaunchPod client portal. Such electronic acceptance constitutes CLIENT’s valid execution of, and agreement to be bound by, this Agreement and the applicable SOW to the same extent as if CLIENT had signed this Agreement by hand, and no further signature shall be required unless the Parties otherwise agree in writing.`, bold: true, applies: "all" },
  { text: `This Agreement is executed through CLIENT’s electronic acceptance under Section 12 (Electronic Acceptance). No additional signature page is required unless the Parties expressly agree otherwise in a separate signed writing.`, bold: false, applies: "all" },

// Split a clause's leading "Heading.  " phrase (period + two spaces) out
// and bold it, matching the source document's heading convention. Bare
// section-title paragraphs (no body after the split) render as dividers.
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
const DIVIDER_STYLE = "margin:20px 0 8px;font:700 13px 'Space Mono',monospace;letter-spacing:.08em;color:rgba(255,255,255,.75)";
function renderTosParagraph(text) {
  const idx = text.indexOf(".  ");
  if (idx === -1) {
    // Bare section titles (e.g. "Services.", the document title, "EXHIBIT A")
    // have no ".  " body split — treat short ones as dividers, not prose.
    const style = text.length < 60 ? DIVIDER_STYLE : "margin:0 0 14px";
    return `<p style="${style}">${escapeHtml(text)}</p>`;
  }
  const head = text.slice(0, idx + 1);
  const rest = text.slice(idx + 2).replace(/^\s+/, "");
  if (!rest.trim()) return `<p style="${DIVIDER_STYLE}">${escapeHtml(head)}</p>`;
  return `<p style="margin:0 0 14px"><strong>${escapeHtml(head)}</strong>&nbsp; ${escapeHtml(rest)}</p>`;
}

// Compose the agreement from LPM's actual standard agreement (Michael
// Blackham's 2026-07-28 redline, accepted) — sections tied to the
// Launch → Orbit structure only render for the "launch" path. Postcast/
// Webicast/Audit clients see the universal terms plus a transparent note
// wherever Launch/Orbit-specific language would otherwise go, since
// counsel hasn't drafted equivalent language for those paths yet.
// TODO(legal): once Michael provides Postcast/Webicast cancellation +
// breach-damages language, add it here with applies:"standalone" and
// extend the isLaunch/isAudit branches below to use it instead of the
// pending-note fallback.
// Postcast/Webicast have no "Launch Package" — they bill from day one on
// a flat monthly rate, structurally identical to what Orbit looks like
// once it's running. So per John (2026-08-20): base their equivalent
// clauses on Mike's Orbit Subscription language, swapping terminology,
// rather than leaving those clients with no cancellation/upgrade terms
// at all. These three are DRAFTED, not attorney-authored — flagged
// inline and in the console so they get a quick confirm from Mike before
// anyone treats this as final. They are not simply invented: every
// sentence here is Mike's own Orbit Subscription / Upgrades-Downgrades /
// Termination-Upon-Breach language with "Orbit Subscription" swapped for
// "Postcast/Webicast subscription" and the Launch-Package branch removed
// (since there is no Launch Package for these two products).
const STANDALONE_UPGRADES_CLAUSE = `Client-Managed Upgrades and Downgrades.  CLIENT may request to upgrade, downgrade, or otherwise change its Postcast or Webicast subscription (including any Pods) at any time through the client portal. Any such change will take effect as of the start of the next production cycle following CLIENT’s request, and CLIENT will be billed at the rate applicable to the new package beginning with that production cycle.`;
const STANDALONE_CANCELLATION_CLAUSE = `Postcast/Webicast Subscription.  CLIENT may cancel its Postcast or Webicast subscription at any time by providing LAUNCHPOD at least thirty (30) calendar days’ prior written notice through the client portal or otherwise. This notice period reflects LAUNCHPOD’s advance production scheduling for CLIENT’s Services and is not a cancellation fee or penalty. Cancellation will be effective at the end of the notice period, and CLIENT will remain responsible for the Fee for each production cycle that begins before the effective date of cancellation.`;
const STANDALONE_BREACH_CLAUSE = `Termination Upon Breach.  At any time, either Party (the “Non-breaching Party”) may terminate this Agreement upon written notice to the other Party in the event the other Party (the “Breaching Party”) breaches a material term or condition of this Agreement and fails to cure such breach within thirty (30) calendar days after receipt of written notice from the Non-breaching Party of the nature of the breach. Notwithstanding the foregoing, where LAUNCHPOD is the Non-breaching Party, the cure period afforded to CLIENT as Breaching Party shall be fifteen (15) calendar days rather than thirty (30) calendar days. However, such cure period shall automatically be extended if the cure for the existing default will take more than thirty (30) calendar days to complete so long as the Breaching Party has initiated action to accomplish such cure, and provided that such cure period shall not extend for a period longer than the commercially reasonable time necessary to accomplish such cure. If LAUNCHPOD is the Breaching Party and CLIENT terminates this Agreement pursuant to this Section 9.2, then any and all fees owed by CLIENT to LAUNCHPOD shall cease to accrue on and after the date of the breach of a material term giving rise to termination so long as CLIENT, upon discovery of such breach, immediately notifies LAUNCHPOD of such breach. CLIENT shall not be entitled to any deliverables and/or services provided by LAUNCHPOD after the date of such breach when fees owed by CLIENT to LAUNCHPOD stop accruing. If CLIENT is the Breaching Party and fails to cure such breach, CLIENT shall pay LAUNCHPOD an amount equal to the Fee for the production cycle in which the breach occurred plus the Fee for the following production cycle, paid no later than thirty (30) calendar days after the end of the thirty (30) calendar day cure period. LAUNCHPOD may also suspend the Services immediately upon notice of breach and pending cure.`;

function adaptedTag() {
  return `<p style="margin:-6px 0 14px;font-style:italic;font-size:12px;color:rgba(255,255,255,.35)">Adapted from the Orbit Subscription language above — pending Michael's confirmation.</p>`;
}

function renderTosDocument(path) {
  const isLaunch = path === "launch";
  const isAudit = path === "audit";
  const isStandalone = !isLaunch && !isAudit; // postcast / webicast
  let html = "";
  for (const c of TOS_CLAUSES) {
    if (c.applies === "launch" && !isLaunch) {
      if (c.flag === "upgrades-slot" && isStandalone) {
        html += renderTosParagraph(STANDALONE_UPGRADES_CLAUSE) + adaptedTag();
      }
      continue;
    }
    if (c.flag === "breach-note" && isStandalone) {
      html += renderTosParagraph(STANDALONE_BREACH_CLAUSE) + adaptedTag();
      continue;
    }
    html += renderTosParagraph(c.text);
    if (c.flag === "convenience-header") {
      if (isAudit) {
        html += `<p style="margin:0 0 14px;font-style:italic;color:rgba(255,255,255,.4)">Not applicable — the Podcast Audit is a one-time engagement with no recurring subscription to cancel.</p>`;
      } else if (isStandalone) {
        html += renderTosParagraph(STANDALONE_CANCELLATION_CLAUSE) + adaptedTag();
      }
    }
  }
  return html;
}

function renderStepTos() {
  const path = state.pkg.path;
  const pendingNote = path !== "launch"
    ? `<div style="font:600 12px 'Instrument Sans',sans-serif;color:#FF2EA0;margin-bottom:14px">A few sections below are adapted for this package type and still need a quick confirm from counsel — flagged inline.</div>`
    : "";
